[[macros.html]]
<!DOCTYPE html>
<html lang="en">
   <head>
      <title>Continue Out Application</title>
      <meta charset="UTF-8">
      <meta name="author" content="BC Registries and Online Services">
      [[common/style.html]]
      {% if enable_sandbox %}
         [[common/watermark.html]]
      {% endif %}
   </head>
   <body>
      <div class="header">
         <table class="header-table" role="presentation">
            <tr class="no-page-break">
               <td>
                  [[logo.html]]
               </td>
               <td>
                  <div class="report-type">
                     CONTINUE OUT APPLICATION
                  </div>
                  <div class="report-type-desc">{{ entityDescription }} - {{ entityAct }}</div>
               </td>
            </tr>
         </table>
         <div class="business-name-header">
            <label class="lbl-business-name">
               {{ business.legalName }}
            </label>
         </div>
      </div>
      [[common/businessDetails.html]]

      <div class="section-header pt-4">
         CONTINUE OUT APPLICATION
      </div>
      <div class="container pt-4">
         <div class="no-page-break">
            <div class="section-title mt-4">New jurisdiction</div>
            <div class="section-data pt-2">{{ jurisdiction }}</div>
         </div>
      </div>
   </body>
</html>
